name: Advanced SQL Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: advanced_sql_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d advanced_sql_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: advanced_sql_testing
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database schema
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 -f sql/schema.sql

      - name: Load seed data
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 -f sql/seed_data.sql

      - name: Run automated tests
        run: python -m pytest -v
